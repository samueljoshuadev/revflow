# Reverse proxy for the Next.js standalone server listening on 127.0.0.1:3000.
# Install at /etc/nginx/sites-available/loovimob and symlink into sites-enabled.
# Run certbot --nginx -d <dominio> -d www.<dominio> afterwards; it rewrites the
# TLS block below with the issued certificate paths.

upstream loovimob_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name DOMINIO www.DOMINIO;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name DOMINIO www.DOMINIO;

  ssl_certificate /etc/letsencrypt/live/DOMINIO/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;

  # Server Actions accept up to 6mb (next.config.ts bodySizeLimit); leave headroom.
  client_max_body_size 12m;

  # Webhook handlers verify provider signatures over the raw body.
  proxy_request_buffering on;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_read_timeout 60s;

  # Immutable build assets.
  location /_next/static/ {
    alias /var/www/loovimob/current/.next/static/;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://loovimob_app;
  }
}
